[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rofi-tmux-plus"
version = "0.8.0a1"
description = "Versioned local and remote tmux lifecycle foundation for the Rofi Plus suite"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Bryan"}]
dependencies = ["tmux-observer==0.2.0a1"]

[project.optional-dependencies]
dev = ["ruff==0.16.6"]

[project.scripts]
rofi-tmux-plus = "rofi_tmux_plus.cli:main"
rofi-tmux-plus-rofi = "rofi_tmux_plus.launcher:main"

[tool.setuptools]
packages = ["rofi_tmux_plus"]

[tool.setuptools.package-data]
rofi_tmux_plus = ["observer-artifact.json", "native/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/reference_frontend/lifecycle.py" = ["FLY002"]
