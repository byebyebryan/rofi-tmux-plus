name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned lint tools and tmux
        run: |
          python -m pip install ruff==0.16.6
          sudo apt-get update
          sudo apt-get install --yes tmux xz-utils
          curl --fail --location --silent --show-error \
            --output shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar --extract --file shellcheck.tar.xz
          sudo install --mode=0755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: Run repository gate
        run: ./scripts/check
