name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned lint tools and tmux
        run: |
          python -m pip install ruff==0.16.6
          sudo apt-get update
          sudo apt-get install --yes tmux xz-utils
          shellcheck_tmpdir="$(mktemp -d)"
          trap 'rm -rf -- "$shellcheck_tmpdir"' EXIT
          curl --fail --location --silent --show-error \
            --output "$shellcheck_tmpdir/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar --extract --file "$shellcheck_tmpdir/shellcheck.tar.xz" \
            --directory "$shellcheck_tmpdir"
          sudo install --mode=0755 \
            "$shellcheck_tmpdir/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Run repository gate
        env:
          TMUX_OBSERVER_WHEEL: ${{ runner.temp }}/tmux_observer-0.6.0a5-py3-none-any.whl
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          pin = json.loads(Path("rofi_tmux_plus/observer-artifact.json").read_text())
          wheel = Path(os.environ["TMUX_OBSERVER_WHEEL"])
          url = "https://github.com/byebyebryan/tmux-observer/releases/download/v" + pin["version"] + "/" + wheel.name
          with urllib.request.urlopen(url, timeout=30) as response:
              raw = response.read(4 * 1024 * 1024 + 1)
          assert len(raw) <= 4 * 1024 * 1024, "observer artifact exceeds bound"
          assert hashlib.sha256(raw).hexdigest() == pin["wheelSha256"], "observer artifact drift"
          wheel.write_bytes(raw)
          PY
          python -m pip install --no-deps "$TMUX_OBSERVER_WHEEL"
          ./scripts/check
